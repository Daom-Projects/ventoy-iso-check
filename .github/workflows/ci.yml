# CI — ventoy-iso-check
# Solo unit tests + build Docker. No monta discos Ventoy reales.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (uv + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (frozen lock)
        run: uv sync --frozen --all-groups

      - name: Pytest
        run: uv run pytest -q --tb=short

      - name: CLI smoke (sin disco)
        run: |
          uv run ventoy-iso-check -V
          uv run ventoy-iso-check --help
          uv run ventoy-iso-check scan --help
          uv run ventoy-iso-check export --help
          uv run ventoy-iso-check ventoy --help

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ventoy-iso-check:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke image (sin montar Ventoy)
        run: |
          docker run --rm ventoy-iso-check:ci -V
          docker run --rm ventoy-iso-check:ci --help
