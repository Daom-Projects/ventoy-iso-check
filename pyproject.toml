[project]
name = "ventoy-iso-check"
version = "0.5.0"
description = "Inventario y comprobación de ISOs desactualizadas en un disco Ventoy (híbrido con SuperISOUpdater/sisou)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Diego Ojeda", email = "daom89@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["ventoy", "iso", "updater", "linux", "wsl", "docker"]
dependencies = [
    "httpx>=0.28.1",
    "packaging>=26.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Daom-Projects/ventoy-iso-check"
Repository = "https://github.com/Daom-Projects/ventoy-iso-check"
Issues = "https://github.com/Daom-Projects/ventoy-iso-check/issues"

[project.scripts]
ventoy-iso-check = "ventoy_iso_check.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
