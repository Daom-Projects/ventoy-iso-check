[project]
name = "ventoy-iso-check"
version = "1.1.0"
description = "Inventario y comprobación de ISOs desactualizadas en un disco Ventoy (híbrido con SuperISOUpdater/sisou). CLI Typer/Click + menú interactivo Rich."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Diego Ojeda", email = "daom89@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["ventoy", "iso", "updater", "linux", "wsl", "docker", "rich", "cli"]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.28.1",
    "packaging>=26.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Daom-Projects/ventoy-iso-check"
Repository = "https://github.com/Daom-Projects/ventoy-iso-check"
Issues = "https://github.com/Daom-Projects/ventoy-iso-check/issues"

[project.scripts]
ventoy-iso-check = "ventoy_iso_check.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "W",   # warnings
]
ignore = [
    "E501",  # line length: confía en formateo gradual; tablas CLI largas
    "B008",  # function calls in defaults (Typer Option/Argument)
    "UP042",  # str, Enum OK (JSON/serialización); StrEnum opcional
]

[tool.ruff.lint.isort]
known-first-party = ["ventoy_iso_check"]

[tool.ruff.format]
quote-style = "double"
