# Catálogo de ISOs conocidas en el Ventoy de /mnt/e
# managed_by:
#   sisou   → actualizar con SuperISOUpdater
#   catalog → resolver de enlaces / versión propia
#   manual  → solo inventario + nota (sin auto-update)

defaults:
  skip_dir_names:
    - MediCat.USB.v21.12
    - $RECYCLE.BIN
    - System Volume Information
    - Bootloaders
    - windows95-win32-x64-3.1.1
    - PortableApps
    - Programs
  extensions: [".iso", ".img"]

entries:
  - id: ubuntu-desktop
    label: Ubuntu Desktop
    patterns:
      - '(?i)^ubuntu-(\d+\.\d+(?:\.\d+)?)-desktop-amd64\.iso$'
    managed_by: sisou
    sisou_updater: Ubuntu
    page: https://releases.ubuntu.com/
    resolver: ubuntu
    edition: desktop
    arch: amd64

  - id: ubuntu-live-server
    label: Ubuntu Live Server
    patterns:
      - '(?i)^ubuntu-(\d+\.\d+(?:\.\d+)?)-live-server-amd64\.iso$'
    managed_by: sisou
    sisou_updater: Ubuntu
    page: https://releases.ubuntu.com/
    resolver: ubuntu
    edition: live-server
    arch: amd64

  - id: ubuntu-budgie
    label: Ubuntu Budgie
    patterns:
      - '(?i)^ubuntu-budgie-(\d+\.\d+(?:\.\d+)?)-desktop-amd64\.iso$'
    managed_by: catalog
    page: https://cdimage.ubuntu.com/ubuntu-budgie/releases/
    resolver: ubuntu_budgie
    arch: amd64

  - id: popos
    label: Pop!_OS
    patterns:
      - '(?i)^pop-os_(\d+\.\d+)_amd64_(nvidia|intel|generic)_(\d+)\.iso$'
      - '(?i)^pop-os_(\d+\.\d+)_.*\.iso$'
    managed_by: catalog
    page: https://system76.com/pop/download/
    resolver: popos
    edition: nvidia
    arch: amd64
    note: "ISO System76; builds nvidia/intel/generic en iso.pop-os.org"

  - id: linuxmint-cinnamon
    label: Linux Mint Cinnamon
    patterns:
      - '(?i)^linuxmint-(\d+(?:\.\d+)?)-cinnamon-64bit\.iso$'
    managed_by: sisou
    sisou_updater: LinuxMint
    page: https://linuxmint.com/download.php
    resolver: linuxmint
    edition: cinnamon

  - id: linuxmint-mate
    label: Linux Mint MATE
    patterns:
      - '(?i)^linuxmint-(\d+(?:\.\d+)?)-mate-64bit\.iso$'
    managed_by: catalog
    page: https://linuxmint.com/download.php
    resolver: linuxmint
    edition: mate

  - id: linuxmint-xfce
    label: Linux Mint XFCE
    patterns:
      - '(?i)^linuxmint-(\d+(?:\.\d+)?)-xfce-64bit\.iso$'
    managed_by: catalog
    page: https://linuxmint.com/download.php
    resolver: linuxmint
    edition: xfce

  - id: elementaryos
    label: elementary OS
    patterns:
      - '(?i)^elementaryos-(\d+(?:\.\d+)?)-stable-amd64(?:\.(\d{8}))?\.iso$'
      - '(?i)^elementaryos-(\d+(?:\.\d+)?)[._-].*\.iso$'
    managed_by: catalog
    page: https://elementary.io/
    resolver: elementary
    arch: amd64

  - id: virtio-win
    label: VirtIO Win drivers
    patterns:
      - '(?i)^virtio-win-(\d+\.\d+\.\d+)\.iso$'
      - '(?i)^virtio-win-.*\.iso$'
    managed_by: catalog
    page: https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/
    resolver: virtio_win
    note: "Drivers VirtIO para VMs Windows (KVM/Proxmox/QEMU)."

  - id: fedora-workstation
    label: Fedora Workstation
    patterns:
      - '(?i)^Fedora-Workstation-Live-(\d+(?:-\d+(?:\.\d+)?)?)\.x86_64\.iso$'
      - '(?i)^Fedora-Workstation-Live-x86_64-(\d+(?:-\d+(?:\.\d+)?)?)\.iso$'
    managed_by: sisou
    sisou_updater: Fedora
    page: https://fedoraproject.org/workstation/download
    resolver: fedora
    edition: Workstation
    arch: x86_64

  - id: fedora-silverblue
    label: Fedora Silverblue
    patterns:
      - '(?i)^Fedora-Silverblue-ostree-x86_64-(\d+(?:-\d+(?:\.\d+)?)?)\.iso$'
      - '(?i)^Fedora-Silverblue-.*-(\d+(?:-\d+(?:\.\d+)?)?)\.iso$'
    managed_by: sisou
    sisou_updater: Fedora
    page: https://fedoraproject.org/atomic-desktops/silverblue/download/
    resolver: fedora
    edition: Silverblue
    arch: x86_64

  - id: kali-installer
    label: Kali Linux Installer
    patterns:
      - '(?i)^kali-linux-(\d+\.\d+)-installer-amd64\.iso$'
    managed_by: sisou
    sisou_updater: KaliLinux
    page: https://www.kali.org/get-kali/
    resolver: kali
    edition: installer
    arch: amd64

  - id: cachyos-desktop
    label: CachyOS Desktop
    patterns:
      - '(?i)^cachyos-desktop-linux-(\d+)\.iso$'
      - '(?i)^cachyos-desktop-linux-(\d{6})\.iso$'
    managed_by: sisou
    sisou_updater: CachyOS
    page: https://cachyos.org/download/
    resolver: cachyos
    edition: desktop

  - id: tails
    label: Tails
    patterns:
      - '(?i)^tails-amd64-(\d+(?:\.\d+)*)\.(?:img|iso)$'
    managed_by: sisou
    sisou_updater: Tails
    page: https://tails.net/install/download/
    resolver: tails
    arch: amd64

  - id: proxmox-ve
    label: Proxmox VE
    patterns:
      - '(?i)^proxmox-ve[_-](\d+\.\d+-\d+)\.iso$'
    managed_by: sisou
    sisou_updater: Proxmox
    page: https://www.proxmox.com/en/downloads
    resolver: proxmox
    edition: ve

  - id: clonezilla
    label: Clonezilla Live
    patterns:
      - '(?i)^clonezilla-live-(\d+\.\d+\.\d+-\d+)-amd64\.iso$'
    managed_by: sisou
    sisou_updater: Clonezilla
    page: https://clonezilla.org/downloads.php
    resolver: clonezilla
    arch: amd64

  - id: systemrescue
    label: SystemRescue
    patterns:
      - '(?i)^systemrescue-(\d+\.\d+)-amd64\.iso$'
    managed_by: sisou
    sisou_updater: SystemRescue
    page: https://www.system-rescue.org/Download/
    resolver: systemrescue
    arch: amd64

  - id: rescuezilla
    label: Rescuezilla
    patterns:
      - '(?i)^rescuezilla-(\d+\.\d+\.\d+)-64bit\.([a-z]+)\.iso$'
      - '(?i)^rescuezilla-(\d+\.\d+\.\d+)-(64bit|32bit)(?:\.([a-z]+))?\.iso$'
      - '(?i)^rescuezilla-(\d+\.\d+\.\d+)-32bit\.([a-z]+)\.iso$'
    managed_by: sisou
    sisou_updater: Rescuezilla
    page: https://rescuezilla.com/download
    resolver: rescuezilla

  - id: hirens-bootcd-pe
    label: Hiren's BootCD PE
    patterns:
      - '(?i)^HBCD_PE(?:_x64|_\[\[VER\]\]_x64)?\.iso$'
      - '(?i)^HBCD_PE(?:_(\d+(?:\.\d+)*)_)?x64\.iso$'
      - '(?i)^HBCD_PE.*\.iso$'
    managed_by: sisou
    sisou_updater: HirensBootCDPE
    page: https://www.hirensbootcd.org/download/
    resolver: hirens

  - id: windows11
    label: Windows 11
    patterns:
      - '(?i)^Win11_.*?(\d+H\d).*\.iso$'
      - '(?i)^Win11_(\d+H\d)_.*\.iso$'
      - '(?i)^Win11_.*\.iso$'
    managed_by: sisou
    sisou_updater: Windows11
    page: https://www.microsoft.com/software-download/windows11
    resolver: none
    note: "Actualizar con sisou (idioma Spanish Mexico). Sin API de versión fiable en check local."

  - id: windows10
    label: Windows 10
    patterns:
      - '(?i)^Win10_.*\.iso$'
    managed_by: manual
    page: https://www.microsoft.com/software-download/windows10
    resolver: none
    note: "Usar Media Creation Tool de Microsoft. Win10 22H2 es la última."

  - id: windows81
    label: Windows 8.1
    patterns:
      - '(?i)^Win8\.1_.*\.iso$'
    managed_by: manual
    page: https://www.microsoft.com/
    resolver: none
    note: "EOL. Conservar ISO actual; no hay actualizaciones de imagen oficiales."

  - id: windows7
    label: Windows 7
    patterns:
      - '(?i)^Windows\s*7.*\.iso$'
    managed_by: manual
    page: https://www.microsoft.com/
    resolver: none
    note: "EOL. ISO modificada/local; no auto-update."

  # MiniOS antes que XP/Server para que no capturen "WinXP MiniOS" / "WinSrv03-MiniOS"
  - id: minios
    label: MiniOS (mod)
    patterns:
      - '(?i)^MiniOS.*\.iso$'
      - '(?i)^WinXP MiniOS.*\.iso$'
      - '(?i)^WinSrv03-MiniOS.*\.iso$'
      - '(?i)^.*MiniOS.*\.iso$'
    managed_by: manual
    page: https://minios.dev/
    resolver: none
    note: "Imágenes modificadas de terceros. Verificar manualmente en el sitio del autor."

  - id: windows-xp
    label: Windows XP
    patterns:
      - '(?i)^WinXpSp3.*\.iso$'
      - '(?i)^xp_pro\.iso$'
      - '(?i)^WinXP(?! MiniOS).*\.iso$'
    managed_by: manual
    page: https://www.microsoft.com/
    resolver: none
    note: "EOL histórico. Solo inventario."

  - id: windows-server
    label: Windows Server
    patterns:
      - '(?i)^.*windows_server.*\.iso$'
      - '(?i)^us_win_server_.*\.iso$'
      - '(?i)^en-us_windows_server.*\.iso$'
      - '(?i)^WinSrv(?!03-MiniOS).*\.iso$'
    managed_by: manual
    page: https://www.microsoft.com/en-us/evalcenter
    resolver: none
    note: "Eval Center / VLSC. Sin auto-download."

  - id: zorin
    label: Zorin OS
    patterns:
      - '(?i)^Zorin-OS-(\d+(?:\.\d+)?)(?:-Core|-Education|-Pro)?-64-bit(?:-r(\d+))?\.iso$'
      - '(?i)^Zorin-OS-(\d+)(?:-Core)?-64-bit(?:-r(\d+))?\.iso$'
      - '(?i)^Zorin-OS-.*\.iso$'
    managed_by: catalog
    page: https://zorin.com/os/download/
    resolver: zorin

  - id: pearos
    label: pearOS
    patterns:
      - '(?i)^pearOS-([A-Za-z0-9]+)-(\d{4}\.\d+)-x86_64\.iso$'
      - '(?i)^pearOS-.*-(\d{4}\.\d+)-x86_64\.iso$'
      - '(?i)^pearOS-.*\.iso$'
    managed_by: catalog
    page: https://pearos.xyz/
    resolver: pearos
    note: "Proyecto comunitario; releases en GitHub/página del autor."

  - id: debian-netinst
    label: Debian netinst
    patterns:
      - '(?i)^debian-(\d+(?:\.\d+)*)-amd64-netinst\.iso$'
      - '(?i)^debian-(\d+(?:\.\d+)*)-amd64-DVD-1\.iso$'
      - '(?i)^debian-.*-amd64-netinst\.iso$'
    managed_by: catalog
    page: https://www.debian.org/CD/http-ftp/
    resolver: debian
    arch: amd64

  - id: archlinux
    label: Arch Linux
    patterns:
      - '(?i)^archlinux-(\d{4}\.\d{2}\.\d{2})-x86_64\.iso$'
      - '(?i)^archlinux-.*-x86_64\.iso$'
    managed_by: catalog
    page: https://archlinux.org/download/
    resolver: archlinux
    arch: x86_64

  - id: gparted-live
    label: GParted Live
    patterns:
      - '(?i)^gparted-live-(\d+\.\d+\.\d+-\d+)-amd64\.iso$'
      - '(?i)^gparted-live-.*-amd64\.iso$'
    managed_by: catalog
    page: https://gparted.org/download.php
    resolver: gparted
    arch: amd64

  - id: memtest86plus
    label: Memtest86+
    patterns:
      - '(?i)^memtest86\+-(\d+\.\d+)\.iso$'
      - '(?i)^mt86plus_(\d+\.\d+)_.*\.iso$'
      - '(?i)^memtest86plus.*\.iso$'
      - '(?i)^memtest86\+.*\.iso$'
    managed_by: catalog
    page: https://www.memtest.org/
    resolver: memtest86plus

  - id: kaspersky-rescue
    label: Kaspersky Rescue Disk
    patterns:
      - '(?i)^kaspersky.*rescue.*\.iso$'
    managed_by: manual
    page: https://support.kaspersky.com/krd
    resolver: none
    note: "Descarga desde el sitio de Kaspersky (requiere cuenta a veces)."

  - id: strelec
    label: Sergei Strelec WinPE
    patterns:
      - '(?i)^WinPE.*Strelec.*\.iso$'
      - '(?i)^.*Strelec.*\.iso$'
    managed_by: manual
    page: https://sergeistrelec.name/
    resolver: none
    note: "Pack de terceros. Solo inventario."

  - id: medicat
    label: MediCat USB
    patterns:
      - '(?i)^MediCat.*'
    managed_by: manual
    page: https://medicatusb.com/
    resolver: none
    note: "Suite grande; no escanear en profundidad salvo --deep. Actualizar desde el proyecto oficial."

  # --- Distros de taller aún no en el USB (soporte de catálogo listo) ---

  - id: kubuntu
    label: Kubuntu
    patterns:
      - '(?i)^kubuntu-(\d+\.\d+(?:\.\d+)?)-desktop-amd64\.iso$'
      - '(?i)^kubuntu-.*-desktop-amd64\.iso$'
    managed_by: catalog
    page: https://kubuntu.org/getkubuntu/
    resolver: kubuntu
    arch: amd64

  - id: manjaro-xfce
    label: Manjaro XFCE
    patterns:
      - '(?i)^manjaro-xfce-(\d+(?:\.\d+)*)-.*-x86_64\.iso$'
      - '(?i)^manjaro[-_]xfce[-_].*\.iso$'
    managed_by: catalog
    page: https://manjaro.org/download/
    resolver: manjaro
    edition: xfce

  - id: manjaro-kde
    label: Manjaro KDE
    patterns:
      - '(?i)^manjaro-kde-(\d+(?:\.\d+)*)-.*-x86_64\.iso$'
      - '(?i)^manjaro[-_]kde[-_].*\.iso$'
    managed_by: catalog
    page: https://manjaro.org/download/
    resolver: manjaro
    edition: kde

  - id: opensuse-leap
    label: openSUSE Leap
    patterns:
      - '(?i)^openSUSE-Leap-(\d+\.\d+)-DVD-x86_64.*\.iso$'
      - '(?i)^openSUSE-Leap-(\d+\.\d+)-NET-x86_64.*\.iso$'
      - '(?i)^openSUSE-Leap-.*\.iso$'
    managed_by: catalog
    page: https://get.opensuse.org/leap/
    resolver: opensuse
    edition: leap
    arch: x86_64

  - id: opensuse-tumbleweed
    label: openSUSE Tumbleweed
    patterns:
      - '(?i)^openSUSE-Tumbleweed-(?:DVD|NET)-x86_64-Snapshot(\d+)-Media\.iso$'
      - '(?i)^openSUSE-Tumbleweed-.*\.iso$'
    managed_by: catalog
    page: https://get.opensuse.org/tumbleweed/
    resolver: opensuse
    edition: tumbleweed
    arch: x86_64

  - id: rocky-dvd
    label: Rocky Linux DVD
    patterns:
      - '(?i)^Rocky-(\d+(?:\.\d+)*)-x86_64-dvd\.iso$'
      - '(?i)^Rocky-.*-dvd\.iso$'
    managed_by: catalog
    page: https://rockylinux.org/download
    resolver: rocky
    edition: dvd
    arch: x86_64

  - id: rocky-minimal
    label: Rocky Linux minimal
    patterns:
      - '(?i)^Rocky-(\d+(?:\.\d+)*)-x86_64-minimal\.iso$'
    managed_by: catalog
    page: https://rockylinux.org/download
    resolver: rocky
    edition: minimal
    arch: x86_64

  - id: almalinux-dvd
    label: AlmaLinux DVD
    patterns:
      - '(?i)^AlmaLinux-(\d+(?:\.\d+)*)-x86_64-dvd\.iso$'
      - '(?i)^AlmaLinux-.*-dvd\.iso$'
    managed_by: catalog
    page: https://almalinux.org/get-almalinux/
    resolver: almalinux
    edition: dvd
    arch: x86_64

  - id: alpine-standard
    label: Alpine Linux standard
    patterns:
      - '(?i)^alpine-standard-(\d+\.\d+(?:\.\d+)*)-x86_64\.iso$'
      - '(?i)^alpine-extended-(\d+\.\d+(?:\.\d+)*)-x86_64\.iso$'
      - '(?i)^alpine-.*-x86_64\.iso$'
    managed_by: catalog
    page: https://alpinelinux.org/downloads/
    resolver: alpine
    arch: x86_64

  - id: mxlinux
    label: MX Linux
    patterns:
      - '(?i)^MX[-_](\d+(?:\.\d+)*)[^/]*_x64\.iso$'
      - '(?i)^MX[-_].*_x64\.iso$'
    managed_by: catalog
    page: https://mxlinux.org/download-links/
    resolver: mxlinux

  - id: supergrub2
    label: Super Grub2 Disk
    patterns:
      - '(?i)^super_?grub2?_?disk.*\.iso$'
      - '(?i)^supergrub2.*\.iso$'
      - '(?i)^sgd.*\.iso$'
    managed_by: catalog
    page: https://www.supergrubdisk.org/
    resolver: supergrub2

  - id: garuda
    label: Garuda Linux
    patterns:
      - '(?i)^garuda-.*-(\d{8}).*\.iso$'
      - '(?i)^garuda-.*\.iso$'
    managed_by: catalog
    page: https://garudalinux.org/downloads
    resolver: garuda
    edition: dr460nized
    note: "Rolling; ediciones múltiples (dr460nized, gnome, …)."
